<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Easy YT Playlist</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header>
			<h1>Easy YT Playlist</h1>
		</header>
		<main>
			<section id="video" hidden>
				<p class="muted">Add to playlists:</p>
				<p id="video-title" class="video-title"></p>
			</section>
			<p id="no-video" class="muted" hidden>Open a YouTube video to add it to your playlists.</p>
		</main>
		<script type="module" src="popup.js"></script>
	</body>
</html>
