<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Easy YT Playlist</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header>
			<p class="muted">Save to playlists</p>
			<p id="video-title" class="video-title" hidden></p>
			<input id="search" type="search" placeholder="Search playlists" aria-label="Search playlists" autocomplete="off" hidden />
		</header>

		<main>
			<ul id="playlists" class="playlists" hidden></ul>
			<p id="message" class="message muted">Loading playlists…</p>
		</main>

		<footer id="footer" hidden>
			<span id="footer-status" class="footer-status muted" role="status"></span>
			<button id="done" type="button" disabled>Done</button>
		</footer>

		<template id="playlist-template">
			<li>
				<label class="playlist">
					<input type="checkbox" />
					<span class="thumbnail"><img alt="" loading="lazy" decoding="async" /></span>
					<span class="info">
						<span class="title"></span>
						<span class="visibility"><svg viewBox="0 0 24 24" aria-hidden="true"><path /></svg><span class="visibility-label"></span></span>
					</span>
					<span class="status" role="status"></span>
				</label>
			</li>
		</template>

		<script type="module" src="popup.js"></script>
	</body>
</html>
